<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Spec Quiz | Adam Liscia</title>
    <meta name="description" content="Test your knowledge of cocktail measurements with this interactive quiz. Perfect for bartenders and cocktail enthusiasts.">
    
    <!-- SEO Tags -->
    <meta name="keywords" content="cocktail quiz, bartending quiz, cocktail measurements, mixology quiz, cocktail knowledge">
    
    <!-- Additional Meta Tags -->
    <meta property="og:title" content="Cocktail Spec Quiz | Adam Liscia">
    <meta property="og:description" content="Test your knowledge of cocktail measurements with this interactive quiz. Perfect for bartenders and cocktail enthusiasts.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adamliscia.com/pages/bar-tools/cocktail-spec-quiz">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/colors.js"></script>
    <script>
        tailwind.config = window.tailwindConfig;
    </script>
    <link href="../../css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-pearl text-slate">
    <div id="header"></div>

    <!-- Hero Section -->
    <section class="relative pt-24 pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-navy mb-4">Cocktail Spec Quiz</h1>
            <p class="text-lg text-slate max-w-2xl mx-auto">Test your knowledge of classic cocktail measurements and ingredients. Perfect for bartenders and cocktail enthusiasts.</p>
        </div>
    </section>

    <!-- Quiz Section -->
    <section class="py-8 sm:py-12">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white p-6 sm:p-8 rounded-lg shadow-md">
                <!-- Quiz Filters -->
                <div id="quiz-filters" class="mb-6 space-y-4">
                    <h3 class="text-lg font-medium text-navy mb-2">What would you like to be quizzed on?</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="filter-menu" class="rounded text-azure focus:ring-azure">
                            <span class="text-slate">Menu Cocktails</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="filter-nonalcoholic" class="rounded text-azure focus:ring-azure">
                            <span class="text-slate">Non-Alcoholic</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="filter-starred" class="rounded text-azure focus:ring-azure">
                            <span class="text-slate">Starred Cocktails</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="filter-families" class="rounded text-azure focus:ring-azure">
                            <span class="text-slate">Cocktail Families</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="filter-all" class="rounded text-azure focus:ring-azure" checked>
                            <span class="text-slate">All Cocktails</span>
                        </label>
                    </div>
                </div>

                <!-- Quiz Stats -->
                <div class="flex justify-between items-center mb-6">
                    <div class="text-slate/80">
                        <span id="current-question">Question 1</span>
                        <span id="total-questions">/10</span>
                    </div>
                    <div class="text-slate/80">
                        Score: <span id="score">0</span>/<span id="max-score">0</span>
                    </div>
                </div>

                <!-- Quiz Content -->
                <div id="quiz-container" class="space-y-6">
                    <!-- Question -->
                    <div id="question-container" class="text-center">
                        <h2 id="cocktail-name" class="text-2xl font-bold text-navy mb-4"></h2>
                        <p id="question-text" class="text-lg text-slate/80 mb-6"></p>
                    </div>

                    <!-- Answer Options -->
                    <div id="answer-options" class="grid gap-4">
                        <!-- Answer options will be dynamically inserted here -->
                    </div>

                    <!-- Feedback -->
                    <div id="feedback" class="hidden text-center py-4 rounded-md">
                        <p id="feedback-text" class="text-lg font-medium"></p>
                        <button id="next-question" class="mt-4 bg-azure hover:bg-azure/90 text-white px-6 py-2 rounded-md transition-all duration-300 transform hover:scale-105 hover:shadow-lg">
                            Next Question
                        </button>
                    </div>
                </div>

                <!-- Start/Restart Button -->
                <div id="start-container" class="text-center">
                    <button id="start-quiz" class="bg-azure hover:bg-azure/90 text-white px-8 py-3 rounded-md transition-all duration-300 transform hover:scale-105 hover:shadow-lg font-medium">
                        Start Quiz
                    </button>
                </div>

                <!-- Results -->
                <div id="results-container" class="hidden text-center">
                    <h2 class="text-2xl font-bold text-navy mb-4">Quiz Complete!</h2>
                    <p id="final-score" class="text-lg text-slate/80 mb-6"></p>
                    <button id="restart-quiz" class="bg-azure hover:bg-azure/90 text-white px-8 py-3 rounded-md transition-all duration-300 transform hover:scale-105 hover:shadow-lg font-medium">
                        Try Again
                    </button>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <!-- Scripts -->
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let cocktails = [];
            let filteredCocktails = [];
            let currentQuestion = 0;
            let score = 0;
            let quizStarted = false;

            // DOM Elements
            const quizContainer = document.getElementById('quiz-container');
            const startContainer = document.getElementById('start-container');
            const resultsContainer = document.getElementById('results-container');
            const questionContainer = document.getElementById('question-container');
            const answerOptions = document.getElementById('answer-options');
            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedback-text');
            const nextQuestionBtn = document.getElementById('next-question');
            const startQuizBtn = document.getElementById('start-quiz');
            const restartQuizBtn = document.getElementById('restart-quiz');
            const currentQuestionSpan = document.getElementById('current-question');
            const totalQuestionsSpan = document.getElementById('total-questions');
            const scoreSpan = document.getElementById('score');
            const maxScoreSpan = document.getElementById('max-score');
            const finalScoreText = document.getElementById('final-score');

            // Filter checkboxes
            const filterMenu = document.getElementById('filter-menu');
            const filterNonalcoholic = document.getElementById('filter-nonalcoholic');
            const filterStarred = document.getElementById('filter-starred');
            const filterFamilies = document.getElementById('filter-families');
            const filterAll = document.getElementById('filter-all');

            // Load cocktails from JSON
            async function loadCocktails() {
                try {
                    const response = await fetch('./bpi-cocktail-specs.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    cocktails = data.cocktails;
                    return true;
                } catch (error) {
                    console.error('Error loading cocktails:', error);
                    return false;
                }
            }

            // Filter cocktails based on selected options
            function filterCocktails() {
                filteredCocktails = cocktails.filter(cocktail => {
                    if (filterAll.checked) return true;
                    
                    const isMenu = filterMenu.checked && cocktail.isMenu;
                    const isNonalcoholic = filterNonalcoholic.checked && cocktail.isNonAlcoholic;
                    const isStarred = filterStarred.checked && cocktail.isStarred;
                    const isFamily = filterFamilies.checked && cocktail.isFamily;
                    
                    return isMenu || isNonalcoholic || isStarred || isFamily;
                });

                if (filteredCocktails.length === 0) {
                    alert('No cocktails match the selected filters. Please select different options.');
                    return false;
                }
                return true;
            }

            // Generate a random question
            function generateQuestion() {
                if (currentQuestion >= 10) {
                    showResults();
                    return;
                }

                const cocktail = filteredCocktails[Math.floor(Math.random() * filteredCocktails.length)];
                
                // List of ingredients to exclude from questions
                const excludedIngredients = [
                    'Lemon Peel',
                    'Mint',
                    'Mint Leaves',
                    'Lime Wedge',
                    'Lemon Wedge',
                    // Add more ingredients to exclude here
                ];
                
                // Filter out excluded ingredients and get a random ingredient
                const validIngredients = cocktail.ingredients.filter(
                    ingredient => !excludedIngredients.includes(ingredient.ingredient)
                );
                
                if (validIngredients.length === 0) {
                    // If all ingredients are excluded, try another cocktail
                    generateQuestion();
                    return;
                }
                
                const ingredient = validIngredients[Math.floor(Math.random() * validIngredients.length)];
                
                // Clear previous question
                answerOptions.innerHTML = '';
                feedback.classList.add('hidden');
                
                // Update question counter
                currentQuestionSpan.textContent = `Question ${currentQuestion + 1}`;
                totalQuestionsSpan.textContent = '/10';
                
                // Set question text
                document.getElementById('cocktail-name').textContent = cocktail.name;
                document.getElementById('question-text').innerHTML = `What is the measurement for <strong>${ingredient.ingredient}</strong> in a ${cocktail.name}?`;
                
                // Generate answer options
                const isDropOrDash = ingredient.amount.includes('drop') || ingredient.amount.includes('dash');
                let correctAnswer;
                let options;

                if (isDropOrDash) {
                    // Handle drops and dashes
                    const numDropsOrDashes = parseInt(ingredient.amount);
                    correctAnswer = numDropsOrDashes.toString();
                    options = [correctAnswer];
                    
                    // Generate options from 1 to max(4, correctAnswer + 1)
                    const maxOptions = Math.max(4, numDropsOrDashes + 1);
                    const possibleOptions = Array.from({length: maxOptions}, (_, i) => (i + 1).toString());
                    
                    // Remove correct answer from possible options
                    const index = possibleOptions.indexOf(correctAnswer);
                    possibleOptions.splice(index, 1);
                    
                    // Add 3 random options from remaining possibilities
                    while (options.length < 4 && possibleOptions.length > 0) {
                        const randomIndex = Math.floor(Math.random() * possibleOptions.length);
                        const option = possibleOptions.splice(randomIndex, 1)[0];
                        options.push(option);
                    }
                } else {
                    // Regular ingredient handling
                    correctAnswer = ingredient.amount;
                    options = [correctAnswer];
                    
                    // Generate options using .25 oz increments
                    const correctAmount = parseFloat(correctAnswer.replace(' oz', ''));
                    const baseOptions = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25];
                    
                    // Find the index of the correct amount in baseOptions
                    const correctIndex = baseOptions.findIndex(amount => amount === correctAmount);
                    
                    // Get the 3 closest options (2 below and 1 above, or vice versa if at the edges)
                    let nearbyOptions = [];
                    if (correctIndex <= 1) {
                        // If correct answer is 0.25 or 0.5, take 0.375 and the next 2 higher amounts
                        nearbyOptions = [0.375, ...baseOptions.slice(correctIndex + 1, correctIndex + 3)];
                        
                        // If correct answer is 0.25, also include 1 tsp as an option
                        if (correctAmount === 0.25) {
                            options.push('1 tsp');
                        }
                    } else if (correctIndex >= baseOptions.length - 2) {
                        // If correct answer is 1.75 or 2, take the 3 lower amounts
                        if (correctAmount === 2) {
                            // For 2 oz, use 1.5, 1.75, 2, and 2.25
                            nearbyOptions = [1.5, 1.75, 2.25];
                        } else {
                            // For 1.75 oz, use the normal pattern
                            nearbyOptions = baseOptions.slice(correctIndex - 3, correctIndex);
                        }
                    } else {
                        // Take 2 lower and 1 higher amount
                        nearbyOptions = [
                            ...baseOptions.slice(correctIndex - 2, correctIndex),
                            baseOptions[correctIndex + 1]
                        ];
                    }
                    
                    // Add the nearby options to the choices
                    nearbyOptions.forEach(amount => {
                        const option = `${amount} oz`;
                        if (!options.includes(option)) {
                            options.push(option);
                        }
                    });

                    // If correct answer is 0.375 oz, also include 1 tsp as an option
                    if (correctAmount === 0.375) {
                        options.push('1 tsp');
                    }
                }
                
                // Sort options by amount
                options.sort((a, b) => {
                    // If either option is "1 tsp", it should come first
                    if (a === '1 tsp') return -1;
                    if (b === '1 tsp') return 1;
                    
                    const amountA = parseFloat(a);
                    const amountB = parseFloat(b);
                    return amountA - amountB;
                });
                
                // Create answer buttons
                const answerOptionsContainer = document.createElement('div');
                answerOptionsContainer.className = 'flex flex-col items-center space-y-4 max-w-md mx-auto';
                
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'w-full bg-pearl hover:bg-pearl/80 text-slate px-6 py-3 rounded-md transition-all duration-300 transform hover:scale-105 hover:shadow-lg text-center';
                    button.textContent = option;
                    button.addEventListener('click', () => checkAnswer(option, correctAnswer));
                    answerOptionsContainer.appendChild(button);
                });
                
                answerOptions.innerHTML = '';
                answerOptions.appendChild(answerOptionsContainer);
            }

            // Check answer
            function checkAnswer(selectedAnswer, correctAnswer) {
                const buttons = answerOptions.querySelectorAll('button');
                buttons.forEach(button => {
                    button.disabled = true;
                    if (button.textContent === correctAnswer) {
                        button.classList.add('bg-success', 'text-white');
                    } else if (button.textContent === selectedAnswer && selectedAnswer !== correctAnswer) {
                        button.classList.add('bg-red-500', 'text-white');
                    }
                });

                if (selectedAnswer === correctAnswer) {
                    score++;
                    feedbackText.textContent = 'Correct!';
                    feedback.classList.add('bg-success/20', 'text-success');
                } else {
                    feedbackText.textContent = `Incorrect. The correct answer is ${correctAnswer}.`;
                    feedback.classList.add('bg-red-500/20', 'text-red-500');
                }

                feedback.classList.remove('hidden');
                scoreSpan.textContent = score;
            }

            // Show results
            function showResults() {
                quizContainer.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
                finalScoreText.textContent = `You scored ${score} out of 10!`;
            }

            // Start quiz
            async function startQuiz() {
                const loaded = await loadCocktails();
                if (!loaded) {
                    alert('Error loading cocktails. Please try again later.');
                    return;
                }

                if (!filterCocktails()) {
                    return;
                }

                quizStarted = true;
                currentQuestion = 0;
                score = 0;
                scoreSpan.textContent = '0';
                maxScoreSpan.textContent = '10';
                
                startContainer.classList.add('hidden');
                quizContainer.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
                
                generateQuestion();
            }

            // Event Listeners
            startQuizBtn.addEventListener('click', startQuiz);
            restartQuizBtn.addEventListener('click', startQuiz);
            
            nextQuestionBtn.addEventListener('click', () => {
                currentQuestion++;
                generateQuestion();
            });

            // Handle filter changes
            [filterMenu, filterNonalcoholic, filterStarred, filterFamilies, filterAll].forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (this === filterAll) {
                        if (this.checked) {
                            [filterMenu, filterNonalcoholic, filterStarred, filterFamilies].forEach(cb => cb.checked = false);
                        }
                    } else {
                        if (this.checked) {
                            filterAll.checked = false;
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
