<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Menu Generator | Adam Liscia</title>
    <meta name="description" content="Create beautiful, well-balanced cocktail menus using cocktail families and seasonal ingredients.">
    
    <!-- SEO Tags -->
    <meta name="keywords" content="cocktail menu generator, bar menu design, cocktail families, bartending tools">
    
    <!-- Additional SEO Meta Tags -->
    <meta property="og:title" content="Cocktail Menu Generator | Adam Liscia">
    <meta property="og:description" content="Create beautiful, well-balanced cocktail menus using cocktail families and seasonal ingredients.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adamliscia.com/pages/fun/menu-generator">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/colors.js"></script>
    <script>
        tailwind.config = window.tailwindConfig;
    </script>
    <link href="../../css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-pearl text-slate">
    <div id="header"></div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 pt-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-navy mb-4">Cocktail Menu Generator</h1>
            <p class="text-lg text-slate/80 max-w-2xl mx-auto">Create beautiful, well-balanced cocktail menus using cocktail families and seasonal ingredients.</p>
        </div>

        <!-- Menu Configuration -->
        <div class="grid md:grid-cols-2 gap-8 mb-8">
            <!-- Menu Settings -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-navy mb-4">Menu Settings</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate mb-2">Menu Name</label>
                        <input type="text" id="menu-name" placeholder="e.g., Summer Cocktails 2024" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate mb-2">Season</label>
                        <select id="season" class="w-full p-2 border rounded">
                            <option value="spring">Spring</option>
                            <option value="summer">Summer</option>
                            <option value="fall">Fall</option>
                            <option value="winter">Winter</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate mb-2">Number of Cocktails</label>
                        <input type="number" id="cocktail-count" min="4" max="12" value="8" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate mb-2">Include Non-Alcoholic Options</label>
                        <input type="checkbox" id="include-na" class="mr-2">
                    </div>
                </div>
            </div>

            <!-- Cocktail Families -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-navy mb-4">Cocktail Families</h2>
                <div class="space-y-4" id="cocktail-families">
                    <!-- Families will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Generated Menu Preview -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-navy mb-4">Menu Preview</h2>
            <div class="flex justify-between items-center mb-4">
                <button id="generate-menu" class="bg-azure text-white px-6 py-2 rounded hover:bg-azure/90">
                    Generate Menu
                </button>
                <button id="print-menu" class="bg-navy text-white px-6 py-2 rounded hover:bg-navy/90">
                    Print Menu
                </button>
            </div>
            <div id="menu-preview" class="space-y-8">
                <!-- Menu will be generated here -->
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <!-- Scripts -->
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
    <script src="./js/menu-generator.js"></script>
</body>
</html>
